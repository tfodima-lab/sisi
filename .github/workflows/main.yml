name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Generate Android Project & Build APK
        working-directory: ./frontend
        run: |
          export DUO_STATUS_URL=https://duolicious.app
          export DUO_API_URL=https://duolicious.app
          export DUO_CHAT_URL=wss://api.duolicious.app/chat
          export DUO_IMAGES_URL=https://duolicious.app
          export DUO_AUDIO_URL=https://duolicious.app
          export DUO_INVITE_URL=https://duolicious.app
          export DUO_PARTNER_URL=https://duolicious.app
          export DUO_GOOGLE_ANDROID_CLIENT_ID=://googleusercontent.com
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend/android/app/build/outputs/apk/release/*.apk
