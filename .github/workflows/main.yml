name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build armeabi-v7a From Developer Config
        working-directory: ./frontend
        run: |
          eval "$(grep '^export ' build-apk.sh)"
          npm install --legacy-peer-deps
          npx expo prebuild --platform android --clean
          cd android
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m/' gradle.properties
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a/' gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-armv7
          path: frontend/android/app/build/outputs/apk/**/*.apk
